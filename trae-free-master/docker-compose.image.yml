services:
  trae-free:
    image: ghcr.io/patrick-mufeng/trae-free:latest
    container_name: trae-free
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "${RELAY_PORT:-4513}:${PORT:-4513}"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
